# Local demo: `docker compose up --build` then open http://localhost:8080
# The default build runs the in-browser mock API, so no backend is needed.
# For a real backend, build with VITE_USE_MOCK_API=false and point API_UPSTREAM
# at the Spring Boot service (see README → Deployment).
services:
  frontend:
    build:
      context: .
      args:
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: limoz/fleet-frontend:local
    ports:
      - '8080:8080'
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://backend:8080}
    restart: unless-stopped
